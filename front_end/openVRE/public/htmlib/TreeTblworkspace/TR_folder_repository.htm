<tr data-tt-id="##tree_id##" data-tt-parent-id="##tree_id_parent##">
	<td class="highlighted_folder">
		<label class="mt-checkbox mt-checkbox-single mt-checkbox-outline">
			<input type="checkbox" class="checkboxes foldercheck" value="1" name="directory" id="##_id##" />
			<span></span>
		</label>
	</td>
	<td class="highlighted_folder" data-order="##name_sort_key##">
		##filename##
		<!--  span style="font-weight:bold;" search="yes"   type="execution" -->
		<!--<span class="expand_info" onclick="expandInfo(this)"></span>-->
		<div class="extra_info">
			<table style="border:none;border-left:dashed 1px gray;margin:10px 22px;padding:0 3px;">
				<tr>
					<td>Description:</td>
					<td>##description##</td>
				</tr>
				##tool##
				##inPaths##
				##execDetails##
				##viewLog##

			</table>
		</div>
		<a href="javascript:viewFileMeta('##_id##', '##longfilename##', 0);" class="highlighted_folder"><i
				class="fa fa-info-circle"></i></a>
	</td>
	<td>&nbsp;</td>
	<td>&nbsp;</td>
	<td class="highlighted_folder" data-order="##execution_sort_key##"><span class="truncate">##filename##</span></td>
	<td class="highlighted_folder" title="##mtime##" data-order="##date_sort_key##"><span class="truncate2" title="##mtime##">##mtime##</span></td>
	<td class="highlighted_folder" data-order="##size_sort_key##">##size##</td>
	<td>
		<div class="btn-group" style="float:left; position:absolute; margin-top:-10px!important;">
			<button class="btn btn-xs blue-madison dropdown-toggle" type="button" data-toggle="dropdown"
				aria-expanded="false">
				<i class="fa fa-cogs"></i>
				<i class="fa fa-angle-down"></i>
			</button>
			<ul class="dropdown-menu pull-right" role="menu">
				<li><a href="workspace/workspace.php?op=downloadtgz&fn=##_id_URL##"><i class="fa fa-download"></i>
						Download Folder</a></li>
				##rerunLink##
			</ul>
		</div>
	</td>
	<td>##tree_sort##</td>
	<td>##parent_tree_sort##</td>
	<td>##size_parent##</td>
</tr>
