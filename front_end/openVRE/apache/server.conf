<VirtualHost *:80>
    ServerAdmin front_end
    ServerName front_end
    DocumentRoot /var/www/html/openVRE/public/
    DirectoryIndex index.php

    <Directory "/var/www/html/openVRE/public/api">
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule ^/interactive-tool/([^/]+)/?(.*) http://$1:8787/$2 [P,L]

    <Location /interactive-tool/rstudio-noauth/>
        RequestHeader set X-RStudio-Root-Path "/interactive-tool/prova-rstudio"
    </Location>

    ErrorLog  /vre-error.log
    CustomLog /vre-access.log combined
</VirtualHost>
